project: ExampleProject
# Pipeline to use, either mfa_pipeline (paired-end reads) or mfa_se_pipeline (single-end reads)
use: mfa_se_pipeline
# Files containing reads in compressed FASTQ format
# Note: The single-end pipeline uses read_file, the paired-end
# pipeline uses read1_file and read2_file.
read1_file: '/path/to/fastq/files/{sample}_R1.fastq.gz'
read2_file: '/path/to/fastq/files/{sample}_R2.fastq.gz'
read_file: '/path/to/fastq/files/{sample}.fastq.gz'
# Directory containing meta-data like growthrates.tab
meta_dir: '/path/to/metadata_directory'
# Directory in which output files are produced
out_dir: '/path/to/output_directory'
# Directory for temporary files
# Each job get its a private temporary directory whose name starts with {tmp_dir}
# and has a random suffix. To just generate random names without a prefix, tmp_dir
# must be set to e.g. "/tmp/", not just "/tmp". Otherwise, the pipeline would
# try to generate directories like "/tmp<random suffix>" in the root folder. Including
# the project and target label in the prefix here is just for easier identifiability.
tmp_dir: '/tmp/{project}-{target_label}-'
# Reference genome in FASTA format
genome_file: /path/to/reference/genome_file.fasta
# Genome annotation in GFF3 format. velogp looks up the replication origins in it,
# by default all features of type origin_of_replication (see the origins setting)
gff_file: /path/to/reference/genome_file.gff
# Size of window over which the coverage is averaged
windowsize: 10k
# Command used to run individual steps
# Note: To run steps on a slurm cluster, use an execute_cmd like
# execute_cmd: srun -p compute --mem={step_memory_gb}G -c {step_cores} {script_file}
# When running on a cluster, it may be that not all storage is accessible from the
# cluster nodes, or that only accessible read-only. In the case of read-only data,
# set execute_copy_outputs to true to have jobs create output files within tmp_dir
# and to copy from there later. In the case of completely inaccessible storage, also
# set execute_copy_inputs to True to copy input data to tmp_dir and have jobs read it
# from there. If either execute_copy_inputs or execute_copy_outputs is True, tmp_dir
# must point to storage that is accessible *both* from the system running the pipeline
# from the cluster nodes executing scripts. Shared-nothing clusters are currently not
# supported.
execute_cmd: '{script_file}'
execute_copy_inputs: False
execute_copy_outputs: False
# Targets and target groups definitions. Each target group (stationary and exponential
# below) comprises a list of targetss. Each target consists of a list of variables to set,
# and the steps that are to be executed for that target. Targets can define and override
# arbitrary variables -- a target could, for example, override the windowsize defined above.
# For each target, the pipeline sets the listed variables and then executes the steps in the
# order listed. Steps whose output files already exist are skipped.
targets:
  genome:
    - target_label: 'genome_index'
      steps: [ genome_index ]
  stationary:
    - sample: stationary_sample_1
      steps: [ map, mapstats, mappability ] 
    - sample: stationary_sample_2
      steps: [ map, mapstats, mappability ] 
  exponential:
    - sample: exponential_sample_1
      reference: stationary_sample_1
      steps: [ map, mapstats, mappability, abundance, velogp ]
    - sample: exponential_sample_2
      reference: stationary_sample_2
      steps: [ map, mapstats, mappability, abundance, velogp ]
