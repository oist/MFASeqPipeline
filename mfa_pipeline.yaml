project: ProjectName
tmp_base_dir: /tmp
project_dir: '{base_dir}/{project}'
tmp_dir: '{tmp_base_dir}/{project}/{target_label}-'
fastq_dir: '{project_dir}/fastq'
meta_dir: '{project_dir}/meta'
out_dir: '{project_dir}/results'
genome_file: '{base_dir}/genome.fasta'
genome_index_dir: '{genome_file}.bwaidx'
genome_index_prefix: '{genome_index_dir}/index'
genome_circular: True
protocol: sort-seq
velocity_oscillation_model: vt
velogp_origins: oriC
velogp_vx_types: rRNA
velogp_vx_names: terA,terB,terC,terD,terE,terF,terG,terH,terI,terJ
velogp_vx_delayscale: 0.01
velogp_vt_timescale: 0.2
velogp_vt_magnitude: 0.25
velogp_abundance_file: '{out_dir}/{sample}.velogp.abd.gz'
velogp_abundance_plot: '{out_dir}/{sample}.velogp.abd.pdf'
velogp_vt_file: '{out_dir}/{sample}.velogp.vt.gz'
velogp_vt_plot: '{out_dir}/{sample}.velogp.vt.pdf'
velogp_vx_file: '{out_dir}/{sample}.velogp.vx.gz'
velogp_model_file: '{out_dir}/{sample}.velogp.model.pkl'
velogp_objects_file: '{out_dir}/{sample}.velogp.objs.pkl'
velogp_abd_columns: 'seq,midpoint,coverage_ratio,coverage_ratio_stderr,ratio_mappable'
velogp_extra_args: ''
mori_gamma: 8
mori_ignore: ''
mori_seed: 42
windowsize: 10k
mapping_quality: 20
cores: 32
memory_map_gb: 32
memory_sort_gb: 16
memory_default_gb: 16
time_default: '1-0'
growthrates_file: '{meta_dir}/growthrates.tab'
growthrate_perhour: $(awk -F'\t' '$1 == "{sample}" {{ print $2 }}' '{growthrates_file}')
log_file: '{out_dir}/{target_label}.{step}{log_label}.log'
log_label: ''
read1_file: '{fastq_dir}/{sample}_r1.fastq.gz'
read2_file: '{fastq_dir}/{sample}_r2.fastq.gz'
paired_end: 1
bam_file: '{out_dir}/{sample}.bam'
bam_index_file: '{out_dir}/{sample}.bai'
fastqc_html_file: '{out_dir}/{sample}_fastqc.html'
fastqc_zip_file: '{out_dir}/{sample}_fastqc.zip'
reference_bam_file: '{out_dir}/{reference}.bam'
reference_bam_index_file: '{out_dir}/{reference}.bai'
stats_file: '{out_dir}/{sample}.stats'
regions_file: ''
exclude_regions: ''
mappability_file: '{out_dir}/{sample}.mappability.bed'
reference_mappability_file: '{out_dir}/{reference}.mappability.bed'
abundance_file: '{out_dir}/{sample}.abd.w{windowsize}bp.gz'
abundance_plot: '{out_dir}/{sample}.abd.w{windowsize}bp.pdf'
abundance_plot_cmd: |
  plot "< zcat {abundance_file}" using "midpoint":((column("ratio_mappable") >  0) ? column("covarage_ratio") : NaN) title "{sample} (well mappable windows)", \
       "< zcat {abundance_file}" using "midpoint":((column("ratio_mappable") == 0) ? column("coverage_ratio") : NaN) title "{sample} (badly mappable windows)";
velocity_oscillation_file: '{out_dir}/{sample}.osc.{velocity_oscillation_model}.tab'
mori_summary_file: '{out_dir}/{sample}.mori.g{mori_gamma}.summary.tab'
mori_origins_file: '{out_dir}/{sample}.mori.g{mori_gamma}.gff.gz'
mori_results_file: '{out_dir}/{sample}.mori.g{mori_gamma}.fit.gz'
mori_history_file: '{out_dir}/{sample}.mori.g{mori_gamma}.history.gz'
mori_output_dir: ''
target_label: '{sample}'
shell: /bin/bash
execute_cmd: srun -p compute --job-name='{target_label}.{step}{log_label}' --mem={step_memory_gb}G --time={step_time} -c {step_cores} {script_file}
execute_copy_inputs: False
execute_copy_outputs: True
step_cores: '{cores}'
step_memory_gb: '{memory_default_gb}'
step_time: '{time_default}'
steps:
  - genome_index
  - map
  - fastqc
  - mapstats
  - mappability
  - abundance
  - velocity_oscillation
genome_index_step:
  input:
    - genome_file
  output:
    - genome_index_dir
  script: |
    mkdir -p '{genome_index_dir}'
    bwa index -p '{genome_index_dir}/index' '{genome_file}'
map_step:
  input:
    - read1_file
    - read2_file
    - genome_index_dir
  output:
    - bam_file
    - bam_index_file
  override:
    step_memory_gb: '$[{memory_map_gb}+{memory_sort_gb}]'
  script: |
    set -e
    set -o pipefail
    
    if [[ "{read1_file}" == *.gz ]]; then
      cat="zcat"
    elif [[ "{read1_file}" == *.bz2 ]]; then
      cat="bzcat"
    else
      cat="cat"
    fi
    
    rm -f "{bam_file}.in-progress"
    bwa mem -t {step_cores} -v 1 "{genome_index_prefix}" \
      <(exec $cat "{read1_file}") \
      <(exec $cat "{read2_file}") \
      | samtools sort --threads {step_cores} -m $[{memory_sort_gb}*1024/{step_cores}]M \
          -T {tmp_dir}/{sample}.samtools-sort. \
          -O BAM -l 7 -o "{bam_file}.in-progress" \
          -
    mv "{bam_file}.in-progress" "{bam_file}"
    samtools index -@ {step_cores} "{bam_file}" "{bam_index_file}"
fastqc_step:
  input:
    - bam_file
  output:
    - fastqc_html_file
    - fastqc_zip_file
  script: |
    set -e
    INPUT_FILE="{bam_file}"
    HTML_FILE="${{INPUT_FILE%.bam}}_fastqc.html"
    ZIP_FILE="${{INPUT_FILE%.bam}}_fastqc.zip"
    fastqc --threads "{step_cores}" --noextract "${{INPUT_FILE}}"
    [[ "${{HTML_FILE}}" == "{fastqc_html_file}" ]] || mv "${{HTML_FILE}}" "{fastqc_html_file}"
    [[ "${{ZIP_FILE}}" == "{fastqc_zip_file}" ]] || mv "${{ZIP_FILE}}" "{fastqc_zip_file}"
mapstats_step:
  input:
    - bam_file
    - bam_index_file
  output:
    - stats_file
  override:
    step_cores: 1
  script: |
    {mfa_pipeline_dir}/steps/mapping_statistics.py "{bam_file}" "{stats_file}"
mappability_step:
  input:
    - genome_file
    - genome_index_dir
    - regions_file
    - stats_file
  output:
    - mappability_file
  override:
    step_memory_gb: '{memory_map_gb}'
  script: |
    {mfa_pipeline_dir}/steps/mappability.py "{genome_file}" "{genome_index_prefix}" "{genome_circular}" \
      "$(grep insert_size "{stats_file}" | cut -f 2)" \
      "$(grep read_length "{stats_file}" | cut -f 2)" \
      "{paired_end}" "{mapping_quality}" \
      "{regions_file}" "{exclude_regions}" \
      "{mappability_file}" \
      -t {step_cores} -v 1
abundance_step:
  input:
    - bam_file
    - bam_index_file
    - mappability_file
    - reference_bam_file
    - reference_bam_index_file
    - reference_mappability_file
  output:
     - abundance_file
  override:
    step_cores: 1
    log_label: '.w{windowsize}bp'
  script: |
    {mfa_pipeline_dir}/steps/abundance.py \
      "{bam_file}" "{mappability_file}" \
      "{reference_bam_file}" "{reference_mappability_file}" \
      "{paired_end}" "{mapping_quality}" "{windowsize}" "{abundance_file}"
abundance_plot_step:
  input:
    - abundance_file
  output:
    - abundance_plot
  script: |
    cat <<-EOD | gnuplot
      set terminal pdf size 6in,3in;
      set output "{abundance_plot}";
      {abundance_plot_cmd};
    EOD
velocity_oscillation_step:
  input:
    - abundance_file
  output:
    - velocity_oscillation_file
  script: |
    {mfa_pipeline_dir}/steps/fit_velocity_oscillation.R \
      "{genome_name}" "{velocity_oscillation_model}" "{growthrate_perhour}" "{abundance_file}" "{velocity_oscillation_file}" \
      "{step_cores}"
velogp_step:
  input:
    - abundance_file
    - genome_file
    - genome_annotation_file
    - origin_file
  output:
    - velogp_abundance_file
    - velogp_abundance_plot
    - velogp_vt_file
    - velogp_vt_plot
    - velogp_vx_file
    - velogp_model_file
    - velogp_objects_file
  script: |
    PYTHONPATH="{mfa_pipeline_dir}/steps/velogp" python -m velogp \
      --cores "{step_cores}" \
      --genome "{genome_file}" \
      --gff "{genome_annotation_file}" \
      --bed "{origin_file}" \
      --columns "{velogp_abd_columns}" \
      --vx-feature-types "{velogp_vx_types}" \
      --vx-feature-names "{velogp_vx_names}" \
      --vt-timescale "{velogp_vt_timescale}" \
      --vt-magnitude "{velogp_vt_magnitude}" \
      --out-abundance "{velogp_abundance_file}" \
      --out-trajectories "{velogp_vt_file}" \
      --out-vx-feature-delays "{velogp_vx_file}" \
      --out-model "{velogp_model_file}" \
      --out-objects "{velogp_objects_file}" \
      --plot-vt "{velogp_vt_plot}" \
      --plot-abundance "{velogp_abundance_plot}" \
      --origins "{origins}" \
      --growthrate "{growthrate_perhour}" \
      {velogp_extra_args} \
      "{abundance_file}"
mori_step:
  input:
    - abundance_file
  output:
    - mori_summary_file
    - mori_origins_file
    - mori_results_file
    - mori_history_file
    - mori_output_dir
  override:
    step_cores: 4
    step_time: 4-0
  script: |
    set -e
    set -o pipefail
    if [[ "{mori_output_dir}" != "" ]]; then
      mkdir -p '{mori_output_dir}'
      MORI_PREFIX="{mori_output_dir}/"
    else
      MORI_PREFIX="{tmp_dir}/mori"
    fi
    IFS=, read -ra ignore <<< "{mori_ignore}"
    {mfa_pipeline_dir}/steps/mori/mori.py \
      --protocol "{protocol}" \
      --abundances "{abundance_file}" \
      --growthrate $(awk 'BEGIN {{print {growthrate_perhour}/3600}}') \
      --gamma "{mori_gamma}" \
      --random-seed "{mori_seed}" \
      $(IFS=' ' ; echo "${{ignore[*]/#/--remove-sequence }}") \
      --output-prefix "${{MORI_PREFIX}}" \
      --log iteration \
      --checkpoint -1 \
      --compile \
      --device cpu \
      --threads {step_cores}
    if [[ "{mori_summary_file}" != "" ]]; then
      cp "${{MORI_PREFIX}}_summary.tab" "{mori_summary_file}"
    fi
    if [[ "{mori_origins_file}" != "" ]]; then
      cp "${{MORI_PREFIX}}_origins.gff.gz" "{mori_origins_file}"
    fi
    if [[ "{mori_results_file}" != "" ]]; then
      cp "${{MORI_PREFIX}}_results.gz" "{mori_results_file}"
    fi
    if [[ "{mori_history_file}" != "" ]]; then
      cp "${{MORI_PREFIX}}_history.gz" "{mori_history_file}"
    fi
