project: ProjectName
tmp_base_dir: /tmp
project_dir: '{base_dir}/{project}'
tmp_dir: '{tmp_base_dir}/{project}/{target_label}-'
fastq_dir: '{project_dir}/fastq'
meta_dir: '{project_dir}/meta'
out_dir: '{project_dir}/results'
genome_file: '{base_dir}/genome.fasta'
gff_file: '{base_dir}/genome.gff'
regions_file: ''
exclude_regions: ''
origin_file: ''
genome_index_dir: '{genome_file}.bwaidx'
genome_index_prefix: '{genome_index_dir}/index'
genome_circular: True
velocity_oscillation_model: vt
origins: origin_of_replication
velogp_vx_types: ''
velogp_vx_names: ''
velogp_vx_delayscale: 0.01
velogp_vt_cov: m1
velogp_vt_timescale: 0.2
velogp_vt_magnitude: 0.25
velogp_suffix: ''
velogp_abundance_file: '{out_dir}/{sample}.velogp{velogp_suffix}.abd.gz'
velogp_abundance_plot: '{out_dir}/{sample}.velogp{velogp_suffix}.abd.pdf'
velogp_vt_file: '{out_dir}/{sample}.velogp{velogp_suffix}.vt.gz'
velogp_vt_plot: '{out_dir}/{sample}.velogp{velogp_suffix}.vt.pdf'
velogp_vx_file: '{out_dir}/{sample}.velogp{velogp_suffix}.vx.gz'
velogp_objects_file: '{out_dir}/{sample}.velogp{velogp_suffix}.pkl'
velogp_abd_columns: 'seq,midpoint,coverage_ratio,coverage_ratio_stderr,ratio_mappable'
velogp_seed: 42
velogp_perturbation_rejects: 5
velogp_perturbation_reduction: 0.8408964
velogp_perturbation_min: 0.01
velogp_errormodel: false
velogp_extra_args: ''
velomix_stall_sites: ''
velomix_suffix: ''
velomix_probabilities_file: '{out_dir}/{sample}.velomix{velomix_suffix}.p.gz'
velomix_abundance_file: '{out_dir}/{sample}.velomix{velomix_suffix}.abd.gz'
velomix_abundance_plot: '{out_dir}/{sample}.velomix{velomix_suffix}.abd.pdf'
velomix_vt_file: '{out_dir}/{sample}.velomix{velomix_suffix}.vt.gz'
velomix_vt_plot: '{out_dir}/{sample}.velomix{velomix_suffix}.vt.pdf'
velomix_vx_file: '{out_dir}/{sample}.velomix{velomix_suffix}.vx.gz'
velomix_objects_file: '{out_dir}/{sample}.velomix{velomix_suffix}.pkl'
velomix_seed: 42
velomix_perturbation_rejects: 5
velomix_perturbation_reduction: 0.8408964
velomix_perturbation_min: 0.01
velomix_extra_args: ''
windowsize: 10k
mapping_quality: 20
partition_default: compute
cores: 32
memory_map_gb: 32
memory_sort_gb: 16
memory_default_gb: 16
time_default: '1-0'
growthrates_file: '{meta_dir}/growthrates.tab'
growthrate_perhour: $(awk -F'\t' '$1 == "{sample}" {{ print $2 }}' '{growthrates_file}')
log_file: '{out_dir}/{target_label}.{step}{log_label}.log'
log_label: ''
read1_file: '{fastq_dir}/{sample}_r1.fastq.gz'
read2_file: '{fastq_dir}/{sample}_r2.fastq.gz'
paired_end: True
bam_file: '{out_dir}/{sample}.bam'
bam_index_file: '{out_dir}/{sample}.bai'
fastqc_html_file: '{out_dir}/{sample}_fastqc.html'
fastqc_zip_file: '{out_dir}/{sample}_fastqc.zip'
reference_bam_file: '{out_dir}/{reference}.bam'
reference_bam_index_file: '{out_dir}/{reference}.bai'
stats_file: '{out_dir}/{sample}.stats'
mappability_file: '{out_dir}/{sample}.mappability.bed'
reference_mappability_file: '{out_dir}/{reference}.mappability.bed'
abundance_file: '{out_dir}/{sample}.abd.w{windowsize}bp.gz'
abundance_plot: '{out_dir}/{sample}.abd.w{windowsize}bp.pdf'
abundance_plot_cmd: |
  plot "< gzip -dc {abundance_file}" using "midpoint":((column("ratio_mappable") >  0) ? column("coverage_ratio") : NaN) title "{sample} (well mappable windows)", \
       "< gzip -dc {abundance_file}" using "midpoint":((column("ratio_mappable") == 0) ? column("coverage_ratio") : NaN) title "{sample} (badly mappable windows)";
velocity_oscillation_file: '{out_dir}/{sample}.osc.{velocity_oscillation_model}.tab'
target_label: '{sample}'
shell: /bin/bash
execute_cmd: srun -p '{step_partition}' --job-name='{target_label}.{step}{log_label}' --mem={step_memory_gb}G --time={step_time} -c {step_cores} {script_file}
execute_copy_inputs: False
execute_copy_outputs: True
step_partition: '{partition_default}'
step_cores: '{cores}'
step_memory_gb: '{memory_default_gb}'
step_time: '{time_default}'
steps:
  - genome_index
  - map
  - fastqc
  - mapstats
  - mappability
  - abundance
  - velogp
genome_index_step:
  input:
    - genome_file
  output:
    - genome_index_dir
  script: |
    mkdir -p '{genome_index_dir}'
    bwa index -p '{genome_index_dir}/index' '{genome_file}'
map_step:
  input:
    - read1_file
    - read2_file
    - genome_index_dir
  output:
    - bam_file
    - bam_index_file
  override:
    step_memory_gb: '$[{memory_map_gb}+{memory_sort_gb}]'
  script: |
    set -e
    set -o pipefail
    
    if [[ "{read1_file}" == *.gz ]]; then
      cat="gzip -dc"
    elif [[ "{read1_file}" == *.bz2 ]]; then
      cat="bzcat"
    else
      cat="cat"
    fi
    
    r1_pipe="{tmp_dir}/{sample}.r1.pipe"
    r2_pipe="{tmp_dir}/{sample}.r2.pipe"
    mkfifo "$r1_pipe"
    mkfifo "$r2_pipe"
    $cat "{read1_file}" > "$r1_pipe" &
    r1_pid=$!
    $cat "{read2_file}" > "$r2_pipe" &
    r2_pid=$!
       
    rm -f "{bam_file}.in-progress"
    bwa mem -t {step_cores} -v 1 "{genome_index_prefix}" "$r1_pipe" "$r2_pipe" \
      | samtools sort --threads {step_cores} -m $[{memory_sort_gb}*1024/{step_cores}]M \
          -T "{tmp_dir}/{sample}.samtools-sort." \
          -O BAM -l 7 -o "{bam_file}.in-progress" \
          -
    
    wait $r1_pid
    wait $r2_pid
    
    mv "{bam_file}.in-progress" "{bam_file}"
    samtools index -@ {step_cores} "{bam_file}" "{bam_index_file}"
fastqc_step:
  input:
    - bam_file
  output:
    - fastqc_html_file
    - fastqc_zip_file
  script: |
    set -e
    INPUT_FILE="{bam_file}"
    HTML_FILE="${{INPUT_FILE%.bam}}_fastqc.html"
    ZIP_FILE="${{INPUT_FILE%.bam}}_fastqc.zip"
    fastqc --threads "{step_cores}" --noextract "${{INPUT_FILE}}"
    [[ "${{HTML_FILE}}" == "{fastqc_html_file}" ]] || mv "${{HTML_FILE}}" "{fastqc_html_file}"
    [[ "${{ZIP_FILE}}" == "{fastqc_zip_file}" ]] || mv "${{ZIP_FILE}}" "{fastqc_zip_file}"
mapstats_step:
  input:
    - bam_file
    - bam_index_file
  output:
    - stats_file
  override:
    step_cores: 1
  script: |
    python3 {mfa_pipeline_dir}/steps/mapping_statistics.py "{bam_file}" "{stats_file}"
mappability_step:
  input:
    - genome_file
    - genome_index_dir
    - regions_file
    - stats_file
  output:
    - mappability_file
  override:
    step_memory_gb: '{memory_map_gb}'
  script: |
    case "{genome_circular}" in
      True) CIRCULAR=--circular ;;
      False) CIRCULAR= ;;
      *) echo "genome_circular must be True or False, not '{genome_circular}'" >&2; exit 1 ;;
    esac
    case "{paired_end}" in
      True) PAIRED="--paired --fragment-length $(grep insert_size "{stats_file}" | cut -f 2)" ;;
      False) PAIRED= ;;
      *) echo "paired_end must be True or False, not '{paired_end}'" >&2; exit 1 ;;
    esac
    python3 {mfa_pipeline_dir}/steps/mappability.py \
      --genome "{genome_file}" \
      --genome-index "{genome_index_prefix}" \
      $CIRCULAR $PAIRED \
      --read-length "$(grep read_length "{stats_file}" | cut -f 2)" \
      --mapping-quality "{mapping_quality}" \
      --regions "{regions_file}" \
      --exclude-regions "{exclude_regions}" \
      --output "{mappability_file}" \
      -- -t {step_cores} -v 1
abundance_step:
  input:
    - bam_file
    - bam_index_file
    - mappability_file
    - reference_bam_file
    - reference_bam_index_file
    - reference_mappability_file
  output:
     - abundance_file
  override:
    step_cores: 1
    log_label: '.w{windowsize}bp'
  script: |
    case "{paired_end}" in
      True) PAIRED=--paired ;;
      False) PAIRED= ;;
      *) echo "paired_end must be True or False, not '{paired_end}'" >&2; exit 1 ;;
    esac
    if [[ -n "{reference_bam_file}" || -n "{reference_mappability_file}" ]]; then
      REFERENCE_ARGS=(--reference-bam "{reference_bam_file}" --reference-mappability "{reference_mappability_file}")
    else
      REFERENCE_ARGS=()
    fi
    python3 {mfa_pipeline_dir}/steps/abundance.py \
      --sample-bam "{bam_file}" \
      --sample-mappability "{mappability_file}" \
      "${{REFERENCE_ARGS[@]}}" \
      $PAIRED \
      --mapping-quality "{mapping_quality}" \
      --windowsize "{windowsize}" \
      --output "{abundance_file}"
abundance_plot_step:
  input:
    - abundance_file
  output:
    - abundance_plot
  script: |
    cat <<-EOD | gnuplot
      set terminal pdf size 6in,3in;
      set output "{abundance_plot}";
      {abundance_plot_cmd};
    EOD
velocity_oscillation_step:
  input:
    - abundance_file
  output:
    - velocity_oscillation_file
  script: |
    Rscript {mfa_pipeline_dir}/steps/fit_velocity_oscillation.R \
      "{genome_name}" "{velocity_oscillation_model}" "{growthrate_perhour}" "{abundance_file}" "{velocity_oscillation_file}" \
      "{step_cores}"
velogp_step:
  input:
    - abundance_file
    - genome_file
    - gff_file
    - origin_file
  output:
    - velogp_abundance_file
    - velogp_abundance_plot
    - velogp_vt_file
    - velogp_vt_plot
    - velogp_vx_file
    - velogp_objects_file
  override:
    step_cores: 4
    log_label: '{velogp_suffix}'
  script: |
    case "{velogp_errormodel}" in
      True) VELOGP_ERRORMODEL=--error-model ;;
      False) VELOGP_ERRORMODEL= ;;
      *) echo "velogp_errormodel must be True or False, not '{velogp_errormodel}'" >&2; exit 1 ;;
    esac
    if [[ "{origin_file}" != "" ]]; then
      VELOGP_ORIGIN_FILE=(--bed "{origin_file}")
    else
      VELOGP_ORIGIN_FILE=()
    fi
    PYTHONPATH="{mfa_pipeline_dir}/steps/velogp" python -m velogp \
      --cores "{step_cores}" \
      --genome "{genome_file}" \
      --gff "{gff_file}" \
      --columns "{velogp_abd_columns}" \
      --vx-feature-types "{velogp_vx_types}" \
      --vx-feature-names "{velogp_vx_names}" \
      --vx-delayscale "{velogp_vx_delayscale}" \
      --vt-covariance "{velogp_vt_cov}" \
      --vt-timescale "{velogp_vt_timescale}" \
      --vt-magnitude "{velogp_vt_magnitude}" \
      --out-abundance "{velogp_abundance_file}" \
      --out-trajectories "{velogp_vt_file}" \
      --out-vx-feature-delays "{velogp_vx_file}" \
      --out-objects "{velogp_objects_file}" \
      --plot-vt "{velogp_vt_plot}" \
      --plot-abundance "{velogp_abundance_plot}" \
      --origins "{origins}" \
      --growthrate "{growthrate_perhour}" \
      --seed "{velogp_seed}" \
      --perturbation-rejects "{velogp_perturbation_rejects}" \
      --perturbation-reduction "{velogp_perturbation_reduction}" \
      --perturbation-min "{velogp_perturbation_min}" \
      "${{VELOGP_ORIGIN_FILE[@]}}" \
      ${{VELOGP_ERRORMODEL}} \
      {velogp_extra_args} \
      "{abundance_file}"
velomix_step:
  input:
    - velogp_objects_file
  output:
    - velomix_abundance_file
    - velomix_abundance_plot
    - velomix_probabilities_file
    - velomix_vt_file
    - velomix_vt_plot
    - velomix_vx_file
    - velomix_objects_file
  override:
    step_cores: 4
    log_label: '{velomix_suffix}'
  script: |
    PYTHONPATH="{mfa_pipeline_dir}/steps/velogp" python -m velogp.velomix \
      --stall-sites "{velomix_stall_sites}" \
      --cores "{step_cores}" \
      --out-probabilities "{velomix_probabilities_file}" \
      --out-abundance "{velomix_abundance_file}" \
      --out-trajectories "{velomix_vt_file}" \
      --out-vx-feature-delays "{velomix_vx_file}" \
      --out-objects "{velomix_objects_file}" \
      --plot-vt "{velomix_vt_plot}" \
      --plot-abundance "{velomix_abundance_plot}" \
      --seed "{velomix_seed}" \
      --perturbation-rejects "{velomix_perturbation_rejects}" \
      --perturbation-reduction "{velomix_perturbation_reduction}" \
      --perturbation-min "{velomix_perturbation_min}" \
      {velomix_extra_args} \
      "{velogp_objects_file}"      
