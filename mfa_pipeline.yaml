project: ProjectName
base_dir: /data
tmp_base_dir: /tmp
project_dir: '{base_dir}/{project}'
tmp_dir: '{tmp_base_dir}/{project}/{sample}/'
fastq_dir: '{project_dir}/fastq'
meta_dir: '{project_dir}/meta'
out_dir: '{project_dir}/results'
genome_file: '{base_dir}/genome.fasta'
genome_index_prefix: '{base_dir}/genome.fasta'
genome_circular: True
velocity_oscillation_model: vt
windowsize: 10k
mapping_quality: 20
cores: 16
memory_map_gb: 16
memory_sort_gb: 16
growthrates_file: '{meta_dir}/growthrates.tab'
growthrate_perhour: $(awk -F'\t' '$1 == "{sample}" {{ print $2 }}' '{growthrates_file}')
log_file: '{out_dir}/{sample}.{step}.log'
read1_file: '{fastq_dir}/{sample}_r1.fastq.gz'
read2_file: '{fastq_dir}/{sample}_r2.fastq.gz'
paired_end: 1
bam_file: '{out_dir}/{sample}.bam'
bam_index_file: '{out_dir}/{sample}.bai'
fastqc_html_file: '{out_dir}/{sample}_fastqc.html'
fastqc_zip_file: '{out_dir}/{sample}_fastqc.zip'
reference_bam_file: '{out_dir}/{reference}.bam'
reference_bam_index_file: '{out_dir}/{reference}.bai'
stats_file: '{out_dir}/{sample}.stats'
regions_file: ''
exclude_regions: ''
mappability_file: '{out_dir}/{sample}.mappability.bed'
reference_mappability_file: '{out_dir}/{reference}.mappability.bed'
abundance_file: '{out_dir}/{sample}.abd.{windowsize}.gz'
velocity_oscillation_file: '{out_dir}/{sample}.osc.{velocity_oscillation_model}.tab'
shell: /bin/bash
execute_cmd: srun -p compute --mem={step_memory_gb}G -c {step_cores} {script_file}
step_cores: 1
step_memory_gb: 8
steps:
  - map
  - fastqc
  - mapstats
  - mappability
  - abundance
map_step:
  input:
    - read1_file
    - read2_file
  output:
    - bam_file
    - bam_index_file
  override:
    step_cores: '{cores}'
    step_memory_gb: '$[{memory_map_gb}+{memory_sort_gb}]'
  script: |
    set -e
    set -o pipefail
    
    rm -f "{bam_file}.in-progress"
    bwa mem -t {step_cores} -v 1 "{genome_index_prefix}" \
      <(exec zcat "{read1_file}") \
      <(exec zcat "{read2_file}") \
      | samtools sort --threads {step_cores} -m $[{memory_sort_gb}*1024/{step_cores}]M \
          -T {tmp_dir}/{sample}.samtools-sort. \
          -O BAM -l 7 -o "{bam_file}.in-progress" \
          -
    mv "{bam_file}.in-progress" "{bam_file}"
    samtools index -@ {step_cores} "{bam_file}" "{bam_index_file}"
fastqc_step:
  input:
    - bam_file
  output:
    - fastqc_html_file
    - fastqc_zip_file
  override:
    step_cores: '{cores}'
  script: |
    set -e
    INPUT_FILE="{bam_file}"
    HTML_FILE="${{INPUT_FILE%.bam}}_fastqc.html"
    ZIP_FILE="${{INPUT_FILE%.bam}}_fastqc.zip"
    fastqc --threads "{step_cores}" --noextract "${{INPUT_FILE}}"
    [[ "${{HTML_FILE}}" == "{fastqc_html_file}" ]] || mv "${{HTML_FILE}}" "{fastqc_html_file}"
    [[ "${{ZIP_FILE}}" == "{fastqc_zip_file}" ]] || mv "${{ZIP_FILE}}" "{fastqc_zip_file}"
mapstats_step:
  input:
    - bam_file
    - bam_index_file
  output:
    - stats_file
  script: |
    {mfa_pipeline_dir}/steps/mapping_statistics.py "{bam_file}" "{stats_file}"
mappability_step:
  input:
    - genome_file
    - regions_file
    - stats_file
  output:
    - mappability_file
  override:
    step_cores: 4
    step_memory_gb: '{memory_map_gb}'
  script: |
    {mfa_pipeline_dir}/steps/mappability.py "{genome_file}" "{genome_index_prefix}" "{genome_circular}" \
      "$(grep insert_size "{stats_file}" | cut -f 2)" \
      "$(grep read_length "{stats_file}" | cut -f 2)" \
      "{paired_end}" "{mapping_quality}" \
      "{regions_file}" "{exclude_regions}" \
      "{mappability_file}" \
      -t {step_cores} -v 1
abundance_step:
  input:
    - bam_file
    - bam_index_file
    - mappability_file
    - reference_bam_file
    - reference_bam_index_file
    - reference_mappability_file
  output:
     - abundance_file
  script: |
    {mfa_pipeline_dir}/steps/abundance.py \
      "{bam_file}" "{mappability_file}" \
      "{reference_bam_file}" "{reference_mappability_file}" \
      "{paired_end}" "{mapping_quality}" "{windowsize}" "{abundance_file}"
velocity_oscillation_step:
  input:
    - abundance_file
  output:
    - velocity_oscillation_file
  override:
    step_cores: 32
    step_memory_gb: 8
  script: |
    {mfa_pipeline_dir}/steps/fit_velocity_oscillation.R \
      "{genome_name}" "{velocity_oscillation_model}" "{growthrate_perhour}" "{abundance_file}" "{velocity_oscillation_file}" \
      "{step_cores}"
