use: sra_pipeline
fastq_step:
    input:
        - sra_file
    output:
        - read_file
    script: |
        set -e
        set -o pipefail
        
        rm -f "{tmp_dir}/{accession}*.fastq"
        fastq-dump --outdir "{tmp_dir}" --split-3 --log-level info -vv "{sra_file}"
        
        if [[ -e "{tmp_dir}/{accession}_1.fastq" ]] || [[ -e "{tmp_dir}/{accession}_2.fastq" ]]; then
            echo "WARNING: Ignoring paired-end reads" >&2
        fi
        if [[ "{read_file}" == *.gz ]]; then
            gzip -c < "{tmp_dir}/{accession}.fastq" > "{read_file}"
            rm "{tmp_dir}/{accession}.fastq"
        else
            mv "{tmp_dir}/{accession}.fastq" "{read_file}"
        fi
