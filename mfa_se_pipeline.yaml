read_file: '{fastq_dir}/{sample}.fastq.gz'
paired_end: 0
use:
  - mfa_pipeline
map_step:
  input:
    - read_file
  output:
    - bam_file
    - bam_index_file
  override:
    step_memory_gb: '$[{memory_map_gb}+{memory_sort_gb}]'
  script: |
    set -e
    set -o pipefail
    
    if [[ "{read_file}" == *.gz ]]; then
      cat="zcat"
    elif [[ "{read_file}" == *.bz2 ]]; then
      cat="bzcat"
    else
      cat="cat"
    fi
    
    r_pipe="{tmp_dir}/{sample}.r.pipe"
    mkfifo "$r_pipe"
    $cat "{read_file}" > "$r_pipe" &
    r_pid=$!
       
    rm -f "{bam_file}.in-progress"
    bwa mem -t {step_cores} -v 1 "{genome_index_prefix}" "$r_pipe" \
      | samtools sort --threads {step_cores} -m $[{memory_sort_gb}*1024/{step_cores}]M \
          -T "{tmp_dir}/{sample}.samtools-sort." \
          -O BAM -l 7 -o "{bam_file}.in-progress" \
          -
    
    wait $r_pid

    mv "{bam_file}.in-progress" "{bam_file}"
    samtools index -@ {step_cores} "{bam_file}" "{bam_index_file}"
mappability_step:
  input:
    - genome_file
    - genome_index_dir
    - regions_file
    - stats_file
  output:
    - mappability_file
  override:
    step_memory_gb: '{memory_map_gb}'
  script: |
    python3 {mfa_pipeline_dir}/steps/mappability.py "{genome_file}" "{genome_index_prefix}" "{genome_circular}" \
      "$(grep read_length "{stats_file}" | cut -f 2)" \
      "$(grep read_length "{stats_file}" | cut -f 2)" \
      "{paired_end}" "{mapping_quality}" \
      "{regions_file}" "{exclude_regions}" \
      "{mappability_file}" \
      -t {step_cores} -v 1
