reference_bam_file: ''
reference_bam_index_file: ''
reference_mappability_file: ''
abundance_plot_cmd: |
  plot "< zcat {abundance_file}" using "midpoint":((column("sample_mappable") >  0) ? column("sample_coverage_avg") : NaN) title "{sample} (well mappable windows)", \
       "< zcat {abundance_file}" using "midpoint":((column("sample_mappable") == 0) ? column("sample_coverage_avg") : NaN) title "{sample} (badly mappable windows)";
