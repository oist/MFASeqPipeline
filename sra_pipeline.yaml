sra_dir: "{project_dir}/sra"
sra_file: "{sra_dir}/{accession}.sra"
sra_step:
    output:
        - sra_file
    override:
        step_cores: 1
    script: |
        exec prefetch -o "{sra_file}" --resume no --verify yes --progress "{accession}"
fastq_step:
    input:
        - sra_file
    output:
        - read1_file
        - read2_file
    override:
        step_cores: 1
    script: |
        set -e
        set -o pipefail
        
        rm -f "{tmp_dir}/{accession}"*.fastq
        fastq-dump --outdir "{tmp_dir}" --split-3 --log-level info -v -v "{sra_file}"
        
        if [[ -e "{tmp_dir}/{accession}.fastq" ]]; then
            echo "WARNING: Ignoring single-end reads" >&2
        fi
        if [[ "{read1_file}" == *.gz ]]; then
            echo "Compressing {accession}_1.fastq to produce {read1_file}"
            gzip -c < "{tmp_dir}/{accession}_1.fastq" > "{read1_file}"
            rm "{tmp_dir}/{accession}_1.fastq"
        else
            echo "Moving {accession}_1.fastq to {read1_file}"
            mv "{tmp_dir}/{accession}_1.fastq" "{read1_file}"
        fi
        if [[ "{read2_file}" == *.gz ]]; then
            echo "Compressing {accession}_2.fastq to produce {read2_file}"
            gzip -c < "{tmp_dir}/{accession}_2.fastq" > "{read2_file}"
            rm "{tmp_dir}/{accession}_2.fastq"
        else
            echo "Moving {accession}_2.fastq to {read2_file}"
            mv "{tmp_dir}/{accession}_2.fastq" "{read2_file}"
        fi
