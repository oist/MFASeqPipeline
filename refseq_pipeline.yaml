refseq_dir: '{project_dir}/refseq'
genome_file: '{refseq_dir}/{refseq}.fna'
gff_file: '{refseq_dir}/{refseq}.gff'
genome_download_step:
    output:
        - genome_file
        - gff_file
    override:
        target_label: '{refseq}'
        step_cores: 1
        step_memory_gb: 1
    script: |
        set -e
        
        curl -X GET "https://api.ncbi.nlm.nih.gov/datasets/v2/genome/accession/{refseq}/download?include_annotation_type=GENOME_FASTA&include_annotation_type=GENOME_GFF&hydrated=FULLY_HYDRATED" \
             -H 'accept: application/zip' \
             -o ncbi_dataset.zip
        unzip ncbi_dataset.zip
        fna="$(find ncbi_dataset/ -name '*.fna')"
        gff="$(find ncbi_dataset/ -name '*.gff')"
        cp "$fna" "{genome_file}"
        cp "$gff" "{gff_file}"
